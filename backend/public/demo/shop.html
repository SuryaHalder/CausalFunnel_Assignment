<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trailhead Outfitters - Shop</title>
  <link rel="stylesheet" href="demo.css" />
</head>
<body>
  <header>
    <span class="brand">Trailhead Outfitters</span>
    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="checkout.html">Cart</a>
    </nav>
  </header>

  <section class="grid">
    <div class="card">
      <div class="img"></div>
      <h3>Trail Boots</h3>
      <p>Grippy, broken-in from day one.</p>
      <button class="btn" type="button">Add to cart</button>
    </div>
    <div class="card">
      <div class="img"></div>
      <h3>Camp Stove</h3>
      <p>Boils a litre of water in 3 minutes.</p>
      <button class="btn" type="button">Add to cart</button>
    </div>
    <div class="card">
      <div class="img"></div>
      <h3>Insulated Bottle</h3>
      <p>Cold for 24 hours, hot for 12.</p>
      <button class="btn" type="button">Add to cart</button>
    </div>
    <div class="card">
      <div class="img"></div>
      <h3>Headlamp</h3>
      <p>400 lumens, rechargeable.</p>
      <button class="btn" type="button">Add to cart</button>
    </div>
  </section>

  <footer>This is a demo page used to test the tracking script.</footer>

  <script src="/tracker.js" defer></script>
</body>
</html>
